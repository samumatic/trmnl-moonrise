---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor: '30'
polling_url: '{%- assign mn_lat = lat_lon | default: "52.5200,13.4050" | split: "," | first | strip -%}{%- assign mn_lon = lat_lon | default: "52.5200,13.4050" | split: "," | last | strip -%}{%- assign mn_tz = trmnl.user.time_zone_iana | default: "auto" | url_encode -%}https://api.open-meteo.com/v1/forecast?latitude={{ mn_lat }}&longitude={{ mn_lon }}&daily=sunrise,sunset,daylight_duration&timezone={{ mn_tz }}&forecast_days=2&timeformat=unixtime'
polling_headers: ''
polling_body: ''
id: 535892
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  description: Search for a city or postal code, or enter coordinates as "lat,lon".
  description-de: Ort oder Postleitzahl suchen, oder Koordinaten als "lat,lon" eingeben.
  default: 52.5200,13.4050
- keyname: location_name
  field_type: string
  name: Location name
  description: 'Title on the screen. Empty: the coordinates.'
  description-de: 'Titel auf dem Bildschirm. Leer: die Koordinaten.'
  placeholder: Berlin
  optional: true
- keyname: language
  field_type: select
  name: Language
  description: Auto follows the language of your TRMNL account.
  description-de: Auto folgt der Sprache deines TRMNL-Kontos.
  options:
  - Auto: auto
  - Deutsch: de
  - English: en
  default: auto
- keyname: time_format
  field_type: select
  name: Time format
  description: 'Auto: 24-hour in German, 12-hour in English.'
  description-de: 'Auto: 24 Stunden auf Deutsch, 12 Stunden auf Englisch.'
  options:
  - Auto: auto
  - 24-hour: '24'
  - 12-hour: '12'
  default: auto
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: nature,environment
  github_url: https://github.com/samumatic/trmnl-moonrise
  description: 'Shows when the moon rises and sets today at your location, with the moon drawn in its current phase. A bar across the day shows when the moon is up and when it is night. The full view adds the next full and new moon and moonrise and moonset for the coming week. Works in the far north and south too. German or English, 24-hour or 12-hour times.<br><br>The moon is computed in the plugin after Meeus, <i>Astronomical Algorithms</i>, and checked against the <a href="https://aa.usno.navy.mil/data/RS_OneDay" class="underline" target="_blank">US Naval Observatory</a> to the minute. Sunrise and sunset: <a href="https://open-meteo.com/" class="underline" target="_blank">Weather data by Open-Meteo.com</a> (CC BY 4.0).<br><br>Source code and bug reports: <a href="https://github.com/samumatic/trmnl-moonrise" class="underline" target="_blank">GitHub</a>'
name: Moonrise & Moonset
description: Moon phase, moonrise & moonset
refresh_interval: 60
