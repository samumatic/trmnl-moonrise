name: TRMNL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite the snapshots in tests/snapshots and upload them
        type: boolean
        default: false

env:
  # The trmnlp image the tests run in. Pin a release (trmnl/trmnlp:v0.17.0) to keep runs repeatable.
  TRMNLP_IMAGE: trmnl/trmnlp:latest

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Firefox in the trmnlp image sometimes never reports a page's fonts as loaded, although they are
      # (document.fonts.status stays "loading"), and the example fails with "fonts did not load within 10s".
      # Only those examples run once more. Any other failure fails the job.
      - name: trmnlp test
        env:
          UPDATE: ${{ inputs.update_snapshots && '--update' || '' }}
        run: |
          trmnlp() {
            docker run --rm -e CI=true -e GITHUB_STEP_SUMMARY=/summary.md \
              -e SPEC_OPTS="--format progress --format json --out /plugin/rspec.json" \
              -v "$PWD":/plugin -v "$GITHUB_STEP_SUMMARY":/summary.md "$TRMNLP_IMAGE" test $UPDATE "$@"
          }
          trmnlp --report report && exit 0
          [ -s rspec.json ] || exit 1
          failed=$(jq '[.examples[] | select(.status == "failed")] | length' rspec.json)
          mapfile -t stalled < <(jq -r '.examples[] | select(.status == "failed")
            | select(.exception.message | test("fonts did not load within")) | .id' rspec.json)
          outside=$(jq '.summary.errors_outside_of_examples_count' rspec.json)
          if [ "$outside" != 0 ] || [ "${#stalled[@]}" = 0 ] || [ "${#stalled[@]}" != "$failed" ]; then exit 1; fi
          echo "::warning::Running ${#stalled[@]} example(s) again whose fonts never reported as loaded"
          trmnlp --report report-rerun "${stalled[@]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmnlp-report
          path: |
            report
            report-rerun
      - if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: tests/snapshots
